<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TYMA | Thank You</title>

  <meta name="description"
        content="Welcome to The You Matter Academy. You Matter. Your Story Matters.">

  <meta property="og:title" content="I JUST JOIN TYMA! 🧡">
  <meta property="og:description"
        content="You Matter. Your Story Matters.">
  <meta property="og:url"
        content="https://www.fworld.online/tyma-funnel-thankyou.html">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f58220;
      color: #111;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;

      background: #fff;
      border-radius: 24px;

      padding: 45px 28px;

      text-align: center;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .academy {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 36px;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .message {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .share-button {
      display: block;
      width: 100%;

      background: #111;
      color: #fff;

      text-decoration: none;

      padding: 17px 20px;

      border-radius: 12px;

      font-size: 16px;
      font-weight: 800;

      margin-bottom: 18px;

      transition: 0.2s ease;
    }

    .share-button:hover,
    .share-button:active {
      background: #1877f2;
    }

    .share-text {
      font-size: 14px;
      font-weight: 700;
    }

    .facebook-page {
      display: inline-block;

      color: #111;

      font-weight: 700;
      font-size: 15px;

      text-decoration: underline;
    }

    .facebook-page:hover {
      color: #f58220;
    }

    @media (max-width: 480px) {

      .card {
        padding: 38px 22px;
      }

      h1 {
        font-size: 31px;
      }

      .message {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">TYMA</div>

    <div class="academy">
      THE YOU MATTER ACADEMY
    </div>

    <h1>Thank You! 🧡</h1>

    <p class="message">
      Welcome to TYMA.
    </p>

    <a
      class="share-button"
      href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fwww.fworld.online%2Ftyma-funnel-thankyou.html"
      target="_blank"
      rel="noopener noreferrer">

      SHARE TO FACEBOOK

      <div class="share-text">
        I JUST JOIN TYMA! 🧡
      </div>

    </a>

    <a
      class="facebook-page"
      href="https://www.facebook.com/"
      target="_blank"
      rel="noopener noreferrer">

      Follow us at Facebook Page: Take a Chance

    </a>

  </main>

</body>
</html>
