
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FWORLD AI | Member Login</title>

<meta name="description"
      content="Enter your FWORLD AI Member System and access your personal FWORLD Dashboard.">

<style>

/* =========================================
   RESET
========================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


/* =========================================
   BODY
========================================= */

body {

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #050505;

  color: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;

  overflow-x: hidden;
}


/* =========================================
   DIGITAL GRID
========================================= */

body::before {

  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  opacity: .16;

  background-image:

    linear-gradient(
      rgba(255,255,255,.04) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.04) 1px,
      transparent 1px
    );

  background-size: 45px 45px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 90%
    );
}


/* =========================================
   FLOATING PARTICLES
========================================= */

.particle {

  position: fixed;

  width: 4px;
  height: 4px;

  border-radius: 50%;

  background: #ff1493;

  box-shadow:
    0 0 12px #ff1493;

  opacity: .7;

  animation:
    particleFloat 6s infinite ease-in-out;
}

.particle.one {
  top: 20%;
  left: 12%;
}

.particle.two {
  top: 72%;
  right: 13%;
  animation-delay: 2s;
}

.particle.three {
  top: 35%;
  right: 8%;
  animation-delay: 4s;
}

@keyframes particleFloat {

  0%,100% {
    transform: translateY(0);
    opacity: .3;
  }

  50% {
    transform: translateY(-20px);
    opacity: 1;
  }

}


/* =========================================
   LOGIN SYSTEM
========================================= */

.login-system {

  width: 100%;

  max-width: 440px;

  position: relative;

  z-index: 2;
}


/* =========================================
   BRAND
========================================= */

.brand {

  text-align: center;

  margin-bottom: 25px;
}

.brand-name {

  font-size: 38px;

  font-weight: 900;

  letter-spacing: 7px;
}

.brand-ai {

  margin-top: 8px;

  color: #ff1493;

  font-size: 10px;

  font-weight: 800;

  letter-spacing: 4px;
}


/* =========================================
   AI CORE
========================================= */

.ai-core {

  width: 105px;
  height: 105px;

  margin: 0 auto 28px;

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;
}


/* ORBIT */

.orbit {

  position: absolute;

  inset: 0;

  border:
    1px solid
    rgba(255,20,147,.55);

  border-radius: 50%;

  animation:
    rotateOrbit 7s linear infinite;
}

.orbit::before {

  content: "";

  position: absolute;

  width: 9px;
  height: 9px;

  background: #ff1493;

  border-radius: 50%;

  top: 7px;

  left: 50%;

  transform: translateX(-50%);

  box-shadow:
    0 0 12px #ff1493,
    0 0 30px #ff1493;
}


/* SECOND ORBIT */

.orbit.two {

  inset: 12px;

  border-color:
    rgba(255,255,255,.25);

  animation:
    rotateOrbitReverse 5s linear infinite;
}

.orbit.two::before {

  width: 5px;
  height: 5px;

  background: #fff;

  box-shadow:
    0 0 10px #fff;
}


@keyframes rotateOrbit {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}

@keyframes rotateOrbitReverse {

  from {
    transform: rotate(360deg);
  }

  to {
    transform: rotate(0deg);
  }

}


/* CORE CENTER */

.core-center {

  width: 54px;
  height: 54px;

  border-radius: 50%;

  background:

    radial-gradient(
      circle,
      #ff9bd1,
      #ff1493 40%,
      #7d0048 70%,
      #050505
    );

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 23px;

  box-shadow:

    0 0 18px #ff1493,

    0 0 45px
    rgba(255,20,147,.55),

    0 0 90px
    rgba(255,20,147,.25);

  animation:
    corePulse 2.3s infinite ease-in-out;
}

@keyframes corePulse {

  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.08);
  }

}


/* =========================================
   LOGIN CARD
========================================= */

.login-card {

  background:
    rgba(255,255,255,.97);

  color: #111;

  border-radius: 28px;

  padding: 34px 30px;

  position: relative;

  overflow: hidden;

  border:
    1px solid
    rgba(255,20,147,.20);

  box-shadow:

    0 30px 90px
    rgba(0,0,0,.65);
}


/* TOP LIGHT */

.login-card::before {

  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 3px;

  background:

    linear-gradient(
      90deg,
      transparent,
      #ff1493,
      transparent
    );

  box-shadow:
    0 0 15px #ff1493;
}


/* =========================================
   LOGIN CONTENT
========================================= */

.system-label {

  text-align: center;

  color: #ff1493;

  font-size: 10px;

  font-weight: 800;

  letter-spacing: 3px;

  margin-bottom: 12px;
}

h1 {

  text-align: center;

  font-size: 26px;

  font-weight: 900;

  margin-bottom: 8px;
}

.welcome {

  text-align: center;

  color: #666;

  font-size: 13px;

  line-height: 1.6;

  margin-bottom: 27px;
}


/* =========================================
   INPUTS
========================================= */

.field {

  margin-bottom: 17px;
}

.field label {

  display: block;

  font-size: 12px;

  font-weight: 800;

  margin-bottom: 7px;
}

.field input {

  width: 100%;

  padding: 14px 15px;

  border:
    1px solid #ddd;

  border-radius: 12px;

  background: #fafafa;

  color: #111;

  font-size: 14px;

  outline: none;

  transition: .2s ease;
}

.field input:focus {

  border-color: #ff1493;

  background: #fff;

  box-shadow:
    0 0 0 4px
    rgba(255,20,147,.09);
}


/* =========================================
   LOGIN BUTTON
========================================= */

.enter-button {

  width: 100%;

  padding: 15px;

  margin-top: 5px;

  border: none;

  border-radius: 13px;

  background: #111;

  color: #fff;

  font-size: 14px;

  font-weight: 900;

  cursor: pointer;

  transition: .2s ease;
}

.enter-button:hover {

  background: #ff1493;

  box-shadow:
    0 8px 28px
    rgba(255,20,147,.35);
}

.enter-button:active {

  transform: scale(.98);
}


/* =========================================
   LINKS
========================================= */

.forgot {

  display: block;

  text-align: center;

  margin-top: 18px;

  color: #ff1493;

  font-size: 12px;

  font-weight: 700;

  text-decoration: none;
}

.divider {

  height: 1px;

  background: #eee;

  margin: 24px 0;
}

.join {

  text-align: center;

  color: #777;

  font-size: 12px;

  line-height: 1.7;
}

.join a {

  color: #111;

  font-weight: 900;

  text-decoration: none;
}

.join a:hover {

  color: #ff1493;
}


/* =========================================
   STATUS
========================================= */

.status {

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  margin-top: 20px;

  color: #999;

  font-size: 10px;

  font-weight: 700;

  letter-spacing: 2px;
}

.status-dot {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #ff1493;

  box-shadow:
    0 0 8px #ff1493,
    0 0 18px #ff1493;

  animation:
    statusPulse 1.8s infinite;
}

@keyframes statusPulse {

  0%,100% {
    opacity: .35;
  }

  50% {
    opacity: 1;
  }

}


/* =========================================
   BACK
========================================= */

.back {

  display: block;

  text-align: center;

  margin-top: 18px;

  color: #777;

  font-size: 11px;

  text-decoration: none;
}

.back:hover {

  color: #fff;
}


/* =========================================
   AI LOADING SCREEN
========================================= */

.ai-loading {

  position: fixed;

  inset: 0;

  z-index: 9999;

  background: #030303;

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  text-align: center;

  padding: 20px;
}


/* SHOW */

.ai-loading.active {

  display: flex;

  animation:
    loadingAppear .35s ease forwards;
}

@keyframes loadingAppear {

  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }

}


/* LOADING CORE */

.loading-core {

  width: 150px;
  height: 150px;

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  margin-bottom: 38px;
}


/* OUTER ORBIT */

.loading-orbit {

  position: absolute;

  inset: 0;

  border:

    1px solid
    rgba(255,20,147,.55);

  border-radius: 50%;

  animation:
    loadingRotate 2.8s linear infinite;
}

.loading-orbit::before {

  content: "";

  position: absolute;

  top: 5px;

  left: 50%;

  width: 12px;
  height: 12px;

  transform:
    translateX(-50%);

  border-radius: 50%;

  background: #ff1493;

  box-shadow:

    0 0 12px #ff1493,

    0 0 35px #ff1493,

    0 0 65px
    rgba(255,20,147,.7);
}


/* SECOND ORBIT */

.loading-orbit.two {

  inset: 18px;

  border-color:
    rgba(255,255,255,.25);

  animation:
    loadingRotateReverse 2s linear infinite;
}

.loading-orbit.two::before {

  width: 7px;
  height: 7px;

  background: #fff;

  box-shadow:
    0 0 12px #fff;
}


/* THIRD ORBIT */

.loading-orbit.three {

  inset: 38px;

  border-color:
    rgba(255,20,147,.35);

  animation:
    loadingRotate 1.5s linear infinite;
}

.loading-orbit.three::before {

  width: 5px;
  height: 5px;

  background: #ff9bd1;

  box-shadow:
    0 0 12px #ff1493;
}


@keyframes loadingRotate {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}

@keyframes loadingRotateReverse {

  from {
    transform: rotate(360deg);
  }

  to {
    transform: rotate(0deg);
  }

}


/* CENTER */

.loading-center {

  width: 58px;
  height: 58px;

  border-radius: 50%;

  background:

    radial-gradient(
      circle,
      #ffb1da,
      #ff1493 35%,
      #760041 70%,
      #000
    );

  box-shadow:

    0 0 20px #ff1493,

    0 0 55px
    rgba(255,20,147,.65),

    0 0 100px
    rgba(255,20,147,.25);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 25px;

  animation:
    loadingPulse 1.5s infinite ease-in-out;
}

@keyframes loadingPulse {

  0%,100% {
    transform: scale(.92);
  }

  50% {
    transform: scale(1.08);
  }

}


/* LOADING BRAND */

.loading-brand {

  font-size: 30px;

  font-weight: 900;

  letter-spacing: 6px;

  margin-bottom: 10px;
}


/* LOADING MESSAGE */

.loading-message {

  color: #ff1493;

  font-size: 11px;

  font-weight: 800;

  letter-spacing: 3px;

  min-height: 18px;
}


/* LOADING LINE */

.loading-line {

  width: 190px;

  height: 2px;

  background: #222;

  margin-top: 18px;

  overflow: hidden;

  border-radius: 10px;
}

.loading-line span {

  display: block;

  width: 40%;

  height: 100%;

  background: #ff1493;

  box-shadow:
    0 0 12px #ff1493;

  animation:
    loadingBar 1.1s infinite ease-in-out;
}

@keyframes loadingBar {

  from {
    transform: translateX(-120%);
  }

  to {
    transform: translateX(350%);
  }

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 480px) {

  body {
    padding: 18px;
  }

  .brand-name {
    font-size: 29px;
    letter-spacing: 5px;
  }

  .brand-ai {
    font-size: 8px;
    letter-spacing: 3px;
  }

  .ai-core {
    width: 88px;
    height: 88px;
    margin-bottom: 22px;
  }

  .core-center {
    width: 47px;
    height: 47px;
    font-size: 20px;
  }

  .login-card {
    padding: 30px 21px;
    border-radius: 23px;
  }

  h1 {
    font-size: 22px;
  }

  .welcome {
    font-size: 12px;
  }

  .loading-core {
    width: 125px;
    height: 125px;
  }

  .loading-brand {
    font-size: 25px;
    letter-spacing: 5px;
  }

  .loading-message {
    font-size: 9px;
    letter-spacing: 2.5px;
  }

}

</style>

</head>


<body>
      
<div class="fworld-space">
  <span class="pink-star s1"></span>
  <span class="pink-star s2"></span>
  <span class="pink-star s3"></span>
  <span class="pink-star s4"></span>
  <span class="pink-star s5"></span>
  <span class="pink-comet"></span>
</div>


<!-- PARTICLES -->

<div class="particle one"></div>
<div class="particle two"></div>
<div class="particle three"></div>


<!-- =========================================
     LOGIN SYSTEM
========================================= -->

<main class="login-system">


  <div class="brand">

    <div class="brand-name">
      FWORLD
    </div>

    <div class="brand-ai">
      AI MEMBER SYSTEM
    </div>

  </div>


  <!-- AI CORE -->

  <div class="ai-core">

    <div class="orbit"></div>

    <div class="orbit two"></div>

    <div class="core-center">
      ✦
    </div>

  </div>


  <!-- LOGIN CARD -->

  <section class="login-card">


    <div class="system-label">
      INTELLIGENT ACCESS
    </div>


    <h1>
      Welcome to FWORLD
    </h1>


    <p class="welcome">
      Your digital world is ready.<br>
      Sign in to continue to your personal FWORLD Dashboard.
    </p>


    <form id="loginForm">


      <div class="field">

        <label for="username">
          USERNAME OR EMAIL
        </label>

        <input
          type="text"
          id="username"
          placeholder="Enter your username or email"
          autocomplete="username"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          PASSWORD
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        class="enter-button"
        id="enterButton"
      >
        ENTER MY FWORLD →
      </button>


    </form>


    <a
      href="#"
      class="forgot"
    >
      Forgot your password?
    </a>


    <div class="divider"></div>


    <div class="join">

      New to FWORLD?

      <br>

      <a href="#">
        JOIN FWORLD MEMBERSHIP →
      </a>

    </div>


  </section>


  <div class="status">

    <span class="status-dot"></span>

    AI SYSTEM ONLINE

  </div>


  <a
    href="index.html"
    class="back"
  >
    ← Back to FWORLD
  </a>


</main>



<!-- =========================================
     AI LOADING SCREEN
========================================= -->

<div
  class="ai-loading"
  id="aiLoading"
>


  <div class="loading-core">

    <div class="loading-orbit"></div>

    <div class="loading-orbit two"></div>

    <div class="loading-orbit three"></div>

    <div class="loading-center">
      ✦
    </div>

  </div>


  <div class="loading-brand">
    FWORLD
  </div>


  <div
    class="loading-message"
    id="loadingMessage"
  >
    INITIALIZING AI...
  </div>


  <div class="loading-line">

    <span></span>

  </div>


</div>



<script>


/* =========================================
   LOGIN → AI LOADING → DASHBOARD
========================================= */

const loginForm =
  document.getElementById("loginForm");

const enterButton =
  document.getElementById("enterButton");

const aiLoading =
  document.getElementById("aiLoading");

const loadingMessage =
  document.getElementById("loadingMessage");


loginForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();


    /* BUTTON */

    enterButton.textContent =
      "CONNECTING...";

    enterButton.style.background =
      "#ff1493";


    /* SHOW AI LOADING */

    setTimeout(function() {

      aiLoading.classList.add("active");

    }, 400);


    /* AI SYSTEM MESSAGES */

    const messages = [

      "AUTHENTICATING MEMBER...",

      "CONNECTING TO FWORLD...",

      "LOADING YOUR WORLD...",

      "SYNCING YOUR DASHBOARD...",

      "FWORLD READY"

    ];


    let index = 0;


    const messageTimer =
      setInterval(function() {

        loadingMessage.textContent =
          messages[index];

        index++;


        if (index >= messages.length) {

          clearInterval(messageTimer);

        }

      }, 550);


    /* PREVIEW REDIRECT */

    setTimeout(function() {

      window.location.href =
        "fworld-dashboard.html";

    }, 3200);

  }
);

</script>


</body>
</html>
