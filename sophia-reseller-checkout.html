
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sophia Cosmetics | Checkout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #111;
    }

    .container {
      width: 90%;
      max-width: 700px;
      margin: 50px auto;
    }

    .checkout-card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .logo {
      width: 100px;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .product-summary {
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      padding: 20px 0;
      margin-bottom: 25px;
    }

    .product-summary h2 {
      margin: 0 0 8px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .buy-button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy-button:hover {
      background: #f28c28;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111;
      text-decoration: none;
    }
      .payment-section {
  margin-top: 40px;
  padding-top: 30px;
  border-top: 1px solid #ddd;
}

.payment-section h2 {
  margin-bottom: 10px;
}

.payment-note {
  color: #666;
  line-height: 1.6;
  margin-bottom: 25px;
}

.payment-card {
  margin-bottom: 25px;
}

.payment-card label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
}

.payment-card select {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  background: #fff;
  font-size: 15px;
}

.payment-details {
  display: grid;
  gap: 15px;
}

.payment-option {
  padding: 20px;
  border: 1px solid #ddd;
  background: #ffffff;
  color: #111111;
}

.payment-option h3 {
  margin-top: 0;
  margin-bottom: 12px;
  color: #111111;
}

.payment-option p {
  line-height: 1.6;
  margin: 8px 0;
  color: #333333;
}
  .payment-option strong {
  color: #111111;
}
.payment-status {
  margin-top: 20px;
  padding: 16px 20px;
  background: #ffffff;
  border: 1px solid #ddd;
  color: #111111;
  border-radius: 8px;
}

.payment-status strong {
  color: #111111;
}

.payment-status span {
  margin-left: 8px;
  color: #d97706;
  font-weight: 700;
}

    .place-order-button {
  width: 100%;
  padding: 18px 24px;
  margin-top: 25px;
  border: none;
  border-radius: 8px;
  background: #000000;
  color: #ffffff;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: 0.2s ease;
}

.place-order-button:hover {
  background: #f28c8c;
}

.place-order-button:active {
  transform: scale(0.98);
}
  </style>
</head>

<body>

  <div class="container">

    <div class="checkout-card">

      <img
        src="sophia-logo.jpg"
        alt="Sophia Cosmetics"
        class="logo"
      >

      <h1>Checkout</h1>

      <p class="subtitle">
        Sophia Cosmetics Reseller Package
      </p>

      <div class="product-summary">

        <h2>Sophia Cosmetics Lip Tint</h2>

        <p>Reseller Package</p>

        <div class="price">
          ₱1499.00
        </div>

      </div>

      <form>

        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
        >

        <label for="phone">Mobile Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
        >

        <label for="address">Complete Delivery Address</label>
        <textarea
          id="address"
          name="address"
          required
        ></textarea>

        <label for="shipping">Shipping / Logistics</label>

        <select id="shipping" name="shipping" required>
        <option value="">Select shipping option</option>

        <option value="standard" data-price="250">
            Standard Delivery — ₱250
           </option>
        </select>

          <p class="shipping-note">
           Standard Delivery: ₱250
          </p>

        <button
          type="submit"
          class="buy-button"
        >

          <!-- PAYMENT METHOD -->
<div class="payment-section">

  <h2>Payment Method</h2>

  <p class="payment-note">
    Please choose your preferred payment method and complete your payment
    after submitting your order.
  </p>

  <div class="payment-card">

    <label for="payment">Select Payment Method</label>

    <select id="payment" name="payment" required>
      <option value="">Select payment method</option>

      <option value="gotyme">
        GO TYME
      </option>

      <option value="bpi_bank_transfer">
        BPI Bank Transfer
      </option>
    </select>

  </div>

  <div class="payment-details">

    <div class="payment-option">

      <h3>GO TYME</h3>

      <p>
        <strong>Account Number:</strong><br>
        019421267430
      </p>

    </div>

    <div class="payment-option">

      <h3>BPI Bank Transfer</h3>

      <p>
        <strong>Bank Account Name:</strong><br>
        FMSI Travel Agency
      </p>

      <p>
        <strong>Bank Account Number:</strong><br>
        9439225189
      </p>

    </div>

  </div>

  <div class="payment-status">

    <strong>Payment Status:</strong>
    <span>PENDING PAYMENT</span>

  </div>

</div>

          <button type="submit" class="place-order-button">
           Place Order →
           </button>
          
      </form>

      <a
        href="sophia-reseller-program.html"
        class="back-link"
      >
        ← Back to Sophia Reseller Program
      </a>

    </div>

  </div>

</body>
</html>
