
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sophia Cosmetics | Checkout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #111;
    }

    .container {
      width: 90%;
      max-width: 700px;
      margin: 50px auto;
    }

    .checkout-card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .logo {
      width: 100px;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .product-summary {
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      padding: 20px 0;
      margin-bottom: 25px;
    }

    .product-summary h2 {
      margin: 0 0 8px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .buy-button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy-button:hover {
      background: #f28c28;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="checkout-card">

      <img
        src="sophia-logo.jpg"
        alt="Sophia Cosmetics"
        class="logo"
      >

      <h1>Checkout</h1>

      <p class="subtitle">
        Sophia Cosmetics Reselling Package
      </p>

      <div class="product-summary">

        <h2>Sophia Cosmetics Lip Tint</h2>

        <p>Reselling Package</p>

        <div class="price">
          ₱[AMOUNT]
        </div>

      </div>

      <form>

        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
        >

        <label for="phone">Mobile Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
        >

        <label for="address">Complete Delivery Address</label>
        <textarea
          id="address"
          name="address"
          required
        ></textarea>

        <label for="shipping">Shipping / Logistics</label>
        <select id="shipping" name="shipping" required>

          <option value="">
            Select shipping option
          </option>

          <option value="standard">
            Standard Delivery
          </option>

        </select>

        <button
          type="submit"
          class="buy-button"
        >
          Place Order →
        </button>

      </form>

      <a
        href="sophia-reseller-program.html"
        class="back-link"
      >
        ← Back to Sophia Reseller Program
      </a>

    </div>

  </div>

</body>
</html>
